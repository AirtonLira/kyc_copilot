x-app: &app                    # bloco reaproveitado pelos serviços que usam o nosso container Python
  build: .
  env_file: .env
  working_dir: /app
  volumes:
    - .:/app

services:
  app:
    <<: *app
    command: sleep infinity    # fica de pé; rodamos tudo com `docker compose exec app ...`
    depends_on:
      - neo4j

  check-raw:
    <<: *app
    profiles: ["tools"]        # não sobe com `docker compose up`; só quando chamado
    command: python scripts/check_raw.py

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"   # navegador do Neo4j
      - "7687:7687"   # conexão do código
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data: